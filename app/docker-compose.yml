services:

  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: jenkins
    restart: unless-stopped

    ports:
      - "8080:8080"
      - "50000:50000"

    volumes:
      - jenkins_home:/var/jenkins_home

    networks:
      - devops_network


  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    restart: unless-stopped

    ports:
      - "9000:9000"

    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

    networks:
      - devops_network


  app:
    build:
      context: ./app
      dockerfile: Dockerfile

    container_name: nestjs-app
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      PORT: 3000

    networks:
      - devops_network


volumes:
  jenkins_home:
    external: true

  sonarqube_data:
    external: true

  sonarqube_extensions:
    external: true

  sonarqube_logs:
    external: true


networks:
  devops_network:
    external: true